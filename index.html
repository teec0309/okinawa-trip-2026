<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>沖繩風獅爺 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F9F8F4;    
            --primary-orange: #B44B21; 
            --primary-blue: #616C92;   
            --accent-khaki: #A68F66;   
            --text-dark: #2D2D2D;
            --glass: rgba(255, 255, 255, 0.9);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        body { font-family: "PingFang TC", sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding-bottom: 110px; }

        header { padding: 40px 24px 10px; position: sticky; top: 0; background: var(--bg-color); z-index: 100; }
        .weather-bar { background: var(--primary-blue); color: white; padding: 12px 20px; border-radius: var(--radius-md); margin: 0 24px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }

        .tab-wrapper { display: flex; overflow-x: auto; padding: 0 24px 15px; gap: 10px; scrollbar-width: none; }
        .tab-btn { padding: 8px 20px; background: white; border: 1px solid #DDD; border-radius: 50px; white-space: nowrap; color: var(--primary-blue); font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--primary-blue); color: white; }

        .page-content { display: none; padding: 0 24px; animation: fadeIn 0.3s ease; }
        .page-content.active { display: block; }

        /* 行程卡片樣式 */
        .glass-card { background: var(--glass); border-radius: var(--radius-lg); margin-bottom: 25px; overflow: hidden; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .img-banner { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 20px; }
        .time-label { display: inline-block; padding: 4px 10px; background: var(--accent-khaki); color: white; border-radius: 8px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }

        .nav-link { display: flex; align-items: center; justify-content: center; gap: 8px; background: #FFF; border: 1.5px solid var(--primary-orange); color: var(--primary-orange); padding: 10px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 0.9rem; margin-top: 10px; }

        .highlight-box { background: rgba(180, 75, 33, 0.15); border: 1.5px solid var(--primary-orange); border-radius: var(--radius-md); padding: 15px; margin-bottom: 20px; color: var(--primary-orange); display: block; text-decoration: none; font-weight: bold; }

        /* 機票與資訊 */
        .ticket { background: #616C92; color: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-left: 6px solid var(--primary-orange); position: relative; }
        .ticket::after { content: ""; position: absolute; right: 28%; top: 0; bottom: 0; border-left: 1px dashed rgba(255,255,255,0.4); }
        .t-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        .bottom-nav { position: fixed; bottom: 20px; left: 15px; right: 15px; height: 70px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; }
        .nav-item { color: #999; text-align: center; font-size: 0.7rem; flex: 1; }
        .nav-item.active { color: var(--primary-orange); }
        .nav-item i { font-size: 1.2rem; display: block; margin-bottom: 3px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">沖繩風獅爺</h1>
</header>

<div class="weather-bar">
    <span><i class="fas fa-cloud-sun"></i> 那霸即時天氣</span>
    <span id="temp-val">--°C</span>
</div>

<div id="page-itinerary" class="page-content active">
    <div class="tab-wrapper">
        <div class="tab-btn active" onclick="switchDay(1)">D1</div>
        <div class="tab-btn" onclick="switchDay(2)">D2</div>
        <div class="tab-btn" onclick="switchDay(3)">D3</div>
        <div class="tab-btn" onclick="switchDay(4)">D4</div>
        <div class="tab-btn" onclick="switchDay(5)">D5</div>
        <div class="tab-btn" onclick="switchDay(6)">D6</div>
    </div>

    <div id="day-box">
        </div>
</div>

<div id="page-wallet" class="page-content">
    <h3>💴 支出紀錄 (JPY)</h3>
    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
        <input type="text" id="itemName" placeholder="項目" style="flex:2; padding:10px; border-radius:10px; border:1px solid #DDD;">
        <input type="number" id="itemPrice" placeholder="金額" style="flex:1; padding:10px; border-radius:10px; border:1px solid #DDD;">
        <button onclick="addExpense()" style="background:var(--primary-orange); color:white; border:none; border-radius:10px; width:45px;">+</button>
    </div>
    <div id="expenseList"></div>
</div>

<div id="page-info" class="page-content">
    <div class="ticket">
        <div class="t-row"><span>泰國亞航 FD230 (去)</span><span>02/12</span></div>
        <div class="t-row"><div>TPE<br><small>13:30</small></div><i class="fas fa-plane"></i><div>OKA<br><small>15:55</small></div></div>
    </div>
    <div class="ticket">
        <div class="t-row"><span>台灣虎航 IT231 (回)</span><span>02/17</span></div>
        <div class="t-row"><div>OKA<br><small>09:45</small></div><i class="fas fa-plane" style="transform:rotate(180deg)"></i><div>TPE<br><small>10:45</small></div></div>
    </div>

    <div class="glass-card">
        <img src="https://r-light.jp/naha/wp-content/uploads/sites/2/2021/01/la_gent_naha_exterior_01.jpg" class="img-banner">
        <div class="card-body">
            <h3>La'gent Hotel Naha</h3>
            <p>2 Chome-2-9 Matsuyama, Naha</p>
            <a href="tel:+81988945600" class="nav-link"><i class="fas fa-phone"></i> 撥打飯店電話</a>
        </div>
    </div>

    <div class="glass-card" style="padding:20px; background:rgba(180, 75, 33, 0.05);">
        <h4 style="margin:0 0 10px 0; color:var(--primary-orange);">🚨 緊急資訊</h4>
        報警: 110 / 急救: 119<br>
        駐日辦事處: +81 98-862-5536
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" id="nav-itinerary" onclick="switchPage('itinerary')"><i class="fas fa-calendar-alt"></i>行程</div>
    <div class="nav-item" id="nav-wallet" onclick="switchPage('wallet')"><i class="fas fa-coins"></i>記帳</div>
    <div class="nav-item" id="nav-info" onclick="switchPage('info')"><i class="fas fa-info-circle"></i>資訊</div>
    <div class="nav-item" onclick="changeFontSize()"><i class="fas fa-font"></i>放大</div>
</div>

<script>
    const allDays = {
        1: [
            { time: "15:55", title: "抵達那霸機場", desc: "領取行李，前往 OTS 租車接駁處。", img: "https://images.unsplash.com/photo-1559480671-12eeee334766?w=600", map: "Naha+Airport" },
            { time: "17:00", title: "OTS 租車(臨空豐崎店)", desc: "領取車輛，開啟沖繩自駕之旅。", img: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=600", map: "OTS+Rent-a-car+Rinku+Toyosaki" },
            { time: "19:00", title: "國際通 & 居酒屋", desc: "逛逛最熱鬧的街，吃大眾酒場居酒屋。", img: "https://images.unsplash.com/photo-1621259533310-907604be124e?w=600", map: "Kokusai+Dori" }
        ],
        2: [
            { time: "09:30", title: "出雲大社沖繩分社", desc: "參拜祈福，體驗沖繩神社氛圍。", img: "https://images.unsplash.com/photo-1570114132601-579047915e75?w=600", map: "Izumo+Taisha+Okinawa" },
            { time: "11:30", title: "普天滿宮", desc: "參觀神祕的鐘乳石洞穴神社。", img: "https://images.unsplash.com/photo-1506190500382-d27e253582ba?w=600", map: "Futenma+Shrine" },
            { time: "13:00", title: "泡瀨漁港", desc: "享用新鮮龍蝦與海鮮料理。", img: "https://images.unsplash.com/photo-1560263816-d704d83cce0f?w=600", map: "Awase+Fish+Market" }
        ],
        3: [
            { time: "10:00", title: "美麗海水族館", desc: "看巨大的黑潮之海鯨鯊。", img: "https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?w=600", map: "Churaumi+Aquarium" },
            { time: "14:00", title: "古宇利島", desc: "跨過美麗的海中大橋，吃蝦蝦飯。", img: "https://images.unsplash.com/photo-1506190500382-d27e253582ba?w=600", map: "Kouri+Bridge" }
        ],
        4: [
            { time: "08:05", title: "賞鯨集合 (Prince Smart Inn)", desc: "橘色特別標註：請在此集合搭乘專車。", img: "https://images.unsplash.com/photo-1568430462989-44163eb1752f?w=600", map: "Prince+Smart+Inn+Naha", special: true },
            { time: "08:30", title: "冬春限定賞鯨", desc: "出海追蹤座頭鯨的震撼畫面。", img: "https://images.unsplash.com/photo-1506190500382-d27e253582ba?w=600", map: "Naha+Port" }
        ],
        5: [
            { time: "10:00", title: "波上宮", desc: "沖繩總鎮守，懸崖上的美麗神社。", img: "https://images.unsplash.com/photo-1570114132601-579047915e75?w=600", map: "Naminoue+Shrine" },
            { time: "15:00", title: "小祿站 AEON", desc: "最後大採買，藥妝、超市一次買足。", img: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=600", map: "AEON+Naha+Shopping+Center" }
        ],
        6: [
            { time: "07:30", title: "那霸機場回程", desc: "辦理登機，準備返回台灣。", img: "https://images.unsplash.com/photo-1559480671-12eeee334766?w=600", map: "Naha+Airport" }
        ]
    };

    function switchDay(d) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        const box = document.getElementById('day-box');
        box.innerHTML = '';
        allDays[d].forEach(item => {
            box.innerHTML += `
                <div class="${item.special ? 'highlight-box' : 'glass-card'}">
                    ${item.img ? `<img src="${item.img}" class="img-banner">` : ''}
                    <div class="card-body">
                        <span class="time-label">${item.time}</span>
                        <h3 style="margin:5px 0;">${item.title}</h3>
                        <p style="font-size:0.85rem; color:#666;">${item.desc}</p>
                        <a href="https://www.google.com/maps/search/?api=1&query=${item.map}" class="nav-link"><i class="fas fa-location-arrow"></i> 導航景點</a>
                    </div>
                </div>
            `;
        });
    }

    function switchPage(p) {
        document.querySelectorAll('.page-content').forEach(pc => pc.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(ni => ni.classList.remove('active'));
        document.getElementById('page-'+p).classList.add('active');
        document.getElementById('nav-'+p).classList.add('active');
    }

    function addExpense() {
        const n = document.getElementById('itemName').value;
        const p = document.getElementById('itemPrice').value;
        if(!n || !p) return;
        const div = document.createElement('div');
        div.className = 'glass-card';
        div.style.padding = '10px';
        div.style.marginBottom = '5px';
        div.innerHTML = `<div style="display:flex; justify-content:space-between"><span>${n}</span><b>¥${p}</b></div>`;
        document.getElementById('expenseList').prepend(div);
        document.getElementById('itemName').value=''; document.getElementById('itemPrice').value='';
    }

    let fSize = 16;
    function changeFontSize() { fSize = fSize >= 24 ? 16 : fSize + 4; document.body.style.fontSize = fSize + 'px'; }

    async function fetchWeather() {
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=26.2124&longitude=127.6809&current_weather=true');
            const data = await res.json();
            document.getElementById('temp-val').innerText = data.current_weather.temperature + "°C";
        } catch(e) { document.getElementById('temp-val').innerText = "22°C"; }
    }

    // 初始化顯示第一天與天氣
    switchDay(1);
    fetchWeather();
</script>

</body>
</html>
